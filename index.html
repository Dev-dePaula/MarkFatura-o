<!doctype html>
<html lang="pt-AO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAK Suite — Facturação e Contabilidade (Angola)</title>
<style>
:root{--bg:#f3f5f9;--card:#ffffff;--soft:#f6f8fc;--text:#1b2434;--muted:#5a6579;--border:#e1e6ef;--grid:#e9edf4;--side:#101b2e;--sidetx:#c4cee0;--accent:#2457d6;--acct:#2457d6;--on:#ffffff;--danger:#b3261e;--focus:#2457d6;--c1:#4c7be6;--c2:#1d9e75;--c3:#d9951b;--cv:#d85a30;
--bR:#fde3b5;--tR:#6a3d05;--bD:#d4e4fb;--tD:#0c447c;--bV:#fbd3d3;--tV:#791f1f;--bP:#d3ecb6;--tP:#27500a;--bC:#e0ded6;--tC:#444441;--bE:#c5ece0;--tE:#085041;--bF:#dcd9fa;--tF:#3c3489;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c121c;--card:#151e2d;--soft:#1a2436;--text:#eaeef6;--muted:#a8b3c7;--border:#26324a;--grid:#223049;--side:#080d16;--danger:#f09595;--c1:#85a8f2;--c2:#5dcaa5;--c3:#fac775;--cv:#f0997b;
--bR:#633806;--tR:#fac775;--bD:#0c447c;--tD:#b5d4f4;--bV:#791f1f;--tV:#f7c1c1;--bP:#27500a;--tP:#c0dd97;--bC:#444441;--tC:#d3d1c7;--bE:#085041;--tE:#9fe1cb;--bF:#3c3489;--tF:#cecbf6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c121c;--card:#151e2d;--soft:#1a2436;--text:#eaeef6;--muted:#a8b3c7;--border:#26324a;--grid:#223049;--side:#080d16;--danger:#f09595;--c1:#85a8f2;--c2:#5dcaa5;--c3:#fac775;--cv:#f0997b;
--bR:#633806;--tR:#fac775;--bD:#0c447c;--tD:#b5d4f4;--bV:#791f1f;--tV:#f7c1c1;--bP:#27500a;--tP:#c0dd97;--bC:#444441;--tC:#d3d1c7;--bE:#085041;--tE:#9fe1cb;--bF:#3c3489;--tF:#cecbf6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.sb{background:var(--side);color:var(--sidetx);position:sticky;top:0;height:100vh;overflow:auto;padding:20px 12px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;color:#fff;font-weight:700;font-size:17px}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--on);font-style:normal;font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;color:var(--sidetx);text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:500}
.nav a svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.sbf{margin-top:auto;padding:10px 12px;font-size:12px;color:#8e9bb4;border-top:1px solid rgba(255,255,255,.08)}
.mw{min-width:0}
.tb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--border)}
.tb h1{margin:0;font-size:20px;font-weight:600}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}
.tools a,.tools button.tl{color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;padding:6px 4px}
.tools a:hover,.tools button.tl:hover{color:var(--acct)}
.tools select{width:auto;min-height:34px;padding:4px 8px}
.main{padding:24px 28px 64px;max-width:1280px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:1080px){.cols{grid-template-columns:minmax(0,1fr) 280px}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:20px;overflow:hidden}
.card>h2,.card>.ch{margin:0;padding:16px 22px;font-size:17px;font-weight:600;border-bottom:1px solid var(--border)}
.card>.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .cb{padding:18px 22px}
.card.sm>h2{font-size:14px;padding:12px 16px}
.panel{background:var(--soft);border-bottom:1px solid var(--border);padding:18px 22px}
.sec{font-size:15px;font-weight:600;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.kp{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:18px 0;border-bottom:1px solid var(--border)}
.kp div{padding:4px 8px;border-right:1px solid var(--border)}
.kp div:last-child{border:0}
.kp b{display:block;font-size:22px;font-weight:600}
.kp span{color:var(--muted)}
.btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 16px;cursor:pointer;min-height:40px;font-weight:600;color:var(--text)}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--on);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(.93)}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:32px;padding:4px 12px;font-weight:500;font-size:13px}
.side .btn{display:block;width:100%;margin-bottom:10px;text-align:center}
.link{background:none;border:0;padding:0;color:var(--acct);cursor:pointer;text-decoration:underline;font-weight:600}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;font-weight:500}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 12px;min-height:40px;color:var(--text)}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input:disabled,select:disabled{background:var(--soft);color:var(--muted)}
.fg{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.fg.w2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.two{display:grid;gap:28px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}
.fr{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:10px}
.fr label{margin:0;font-size:13px;color:var(--text);font-weight:600}
.fr.top{align-items:start}
.req{color:var(--danger)}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--muted);font-weight:600;padding:10px 12px;white-space:nowrap;background:var(--soft)}
table.t td{padding:10px 12px;border-top:1px solid var(--border);white-space:nowrap}
table.t .r{text-align:right}
table.t tfoot td{font-weight:700;border-top:2px solid var(--border);background:var(--soft)}
.b{display:inline-block;min-width:24px;text-align:center;border-radius:6px;padding:1px 7px;font-weight:700;font-size:12px}
.b-R{background:var(--bR);color:var(--tR)}.b-D{background:var(--bD);color:var(--tD)}.b-V{background:var(--bV);color:var(--tV)}.b-P{background:var(--bP);color:var(--tP)}.b-C{background:var(--bC);color:var(--tC)}.b-E{background:var(--bE);color:var(--tE)}.b-F{background:var(--bF);color:var(--tF)}
.sumt div{display:flex;justify-content:space-between;gap:10px;padding:8px 16px;border-top:1px solid var(--border);font-size:13px}
.sumt div:first-child{border-top:0}
.sumt div.tot{font-weight:700;font-size:15px;background:var(--soft)}
.sumt .lb{color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:6px 0 14px;font-size:13px}
.legend label{display:inline-flex;gap:6px;align-items:center;color:var(--text);font-size:13px;margin:0;font-weight:400}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.rp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.rc{display:flex;gap:14px;align-items:flex-start;background:var(--soft);border:1px solid var(--border);border-radius:14px;border-top:4px solid var(--rcc);padding:18px 16px;text-align:left;cursor:pointer;width:100%}
.rc:hover{border-color:var(--rcc)}
.rc b{display:block;font-size:16px;font-weight:600}
.rc span{color:var(--muted);font-size:13px}
.hlp{background:var(--soft);border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13px;color:var(--muted);margin-bottom:20px}
.hlp b{display:block;color:var(--text);margin-bottom:4px}
.hlp a,.hlp .link{font-weight:600}
.tabs2{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--border)}
.tabs2 button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs2 button[aria-current="true"]{color:var(--text);border-bottom-color:var(--accent)}
.lgrid{display:grid;grid-template-columns:1fr 2.6fr 1.3fr .8fr 1.2fr .9fr 74px;gap:8px;align-items:center}
.lh{padding:10px 0;border-bottom:1px solid var(--border);color:var(--muted);font-weight:600;font-size:13px}
.lrow{padding:8px 0;border-bottom:1px solid var(--border)}
.mlab{display:none}
@media (max-width:900px){.lh{display:none}.lgrid{grid-template-columns:1fr 1fr}.lgrid .d{grid-column:1 / -1}.mlab{display:block}}
.addbar{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px;flex-wrap:wrap}
.addbar .cnt{color:var(--acct);font-weight:700}
.addbar input{flex:1;min-width:200px}
.addbtn{width:42px;height:42px;border-radius:10px;border:0;background:var(--accent);color:var(--on);font-size:24px;cursor:pointer;line-height:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 22px;background:var(--soft);border-top:1px solid var(--border)}
.err{background:var(--bV);color:var(--tV);border-radius:10px;padding:8px 12px;margin:10px 0}
.note{color:var(--muted);font-size:12px}
.ov{position:fixed;inset:0;background:rgba(8,13,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 12px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;z-index:50}
.dlg{background:var(--card);width:100%;max-width:560px;border-radius:14px;overflow:hidden}
.dlg.wide{max-width:860px}
.dlg h3{margin:0;padding:16px 22px;font-size:17px;font-weight:600;border-bottom:1px solid var(--border)}
.dlg .mb{padding:18px 22px}
.dlg .mf{padding:12px 22px 20px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1b2434;color:#fff;padding:10px 18px;border-radius:10px;z-index:60;max-width:90%}
.rhead{display:flex;gap:14px;align-items:center;background:var(--soft);padding:22px;border-bottom:1px solid var(--border)}
.kz{display:grid;place-items:center;width:52px;height:46px;border-radius:10px;background:var(--accent);color:var(--on);font-weight:700;font-size:18px;flex:none}
.rhead b{display:block;font-size:20px;font-weight:600}
.rhead span{color:var(--muted)}
.paper{background:#fff;color:#1f1e1a;border:1px solid #d3d1c7;padding:26px;font-size:13px;line-height:1.45}
.paper h3{margin:0 0 2px;font-size:17px;border:0;padding:0}
.paper p{margin:0}
.p-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid #1f1e1a;padding-bottom:12px;margin-bottom:12px}
.p-type{text-align:right}.p-type strong{display:block;font-size:17px}
.paper table{width:100%;border-collapse:collapse;margin:10px 0}
.paper th{text-align:left;border-bottom:1px solid #1f1e1a;padding:6px 4px;font-size:12px;background:none;color:#1f1e1a}
.paper td{padding:6px 4px;border-bottom:1px solid #e5e3da;vertical-align:top;border-top:0;white-space:normal}
.paper .r{text-align:right}
.p-sum{margin-left:auto;max-width:340px}
.p-sum div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.p-sum .tot{border-top:2px solid #1f1e1a;margin-top:4px;padding-top:6px;font-weight:700;font-size:15px}
.p-foot{display:flex;gap:16px;align-items:center;border-top:1px solid #d3d1c7;padding-top:12px;margin-top:12px;flex-wrap:wrap}
.qr{width:104px;height:104px;padding:4px;background:#fff;border:1px solid #d3d1c7;display:flex;align-items:center;justify-content:center;flex:none;color:#444}
.qr img,.qr canvas{max-width:100%;height:auto}
.p-meta{flex:1;min-width:200px;font-size:11px;color:#444441;word-break:break-all}
#welcome{max-width:520px;margin:0 auto;padding:48px 16px}
#welcome .logo{color:var(--text);margin-bottom:18px;padding:0}
#print-area{display:none}
.pb{page-break-after:always;height:1px}
@media print{#shell,#welcome,#modal-root,.toast{display:none!important}#print-area{display:block!important}body{background:#fff}}
/* ===== v3: navegação, UX e contabilidade ===== */
.skip{position:absolute;left:-9999px;top:8px;background:var(--accent);color:var(--on);padding:8px 14px;border-radius:8px;z-index:100;font-weight:600}
.skip:focus{left:8px}
.app{transition:grid-template-columns .22s ease}
.sb{padding:16px 12px;gap:12px;z-index:40}
.sbh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;position:relative;flex:none}
.ib svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb .ib{color:var(--sidetx)}.sb .ib:hover{background:rgba(255,255,255,.09);color:#fff}
.tb .ib{color:var(--muted)}.tb .ib:hover{background:var(--soft);color:var(--text)}
.mo{display:none}
.ng{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.nl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8190ab;padding:6px 12px 4px;font-weight:600}
.nav a{position:relative;transition:background .15s,color .15s}
.nav a .nt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{font-style:normal;font-size:11px;font-weight:700;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--bV);color:var(--tV)}
.nb.w{background:var(--bR);color:var(--tR)}
.sbf{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none;font-size:13px}
.un{display:flex;flex-direction:column;min-width:0}
.un b{color:#fff;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.un small{color:#8e9bb4;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{position:fixed;inset:0;background:rgba(8,13,22,.5);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.tb{position:sticky;top:0;z-index:30;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.tbl{display:flex;align-items:center;gap:10px;min-width:0}
.crumb{font-size:12px;color:var(--muted)}.crumb b{font-weight:500;color:var(--text)}
.srch{display:flex;align-items:center;gap:8px;min-width:220px;padding:6px 10px;border:1px solid var(--border);border-radius:10px;background:var(--soft);color:var(--muted);cursor:pointer}
.srch:hover{border-color:var(--accent);color:var(--text)}
.srch svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
kbd{font:11px/1 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--border);border-radius:5px;padding:2px 5px;background:var(--card);color:var(--muted)}
.srch kbd{margin-left:auto}
.dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font:700 10px/16px system-ui,sans-serif;text-align:center;font-style:normal;padding:0 4px}
.pop{position:fixed;top:64px;right:16px;width:min(390px,calc(100vw - 24px));background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(8,13,22,.28);z-index:55;overflow:hidden;animation:pin .16s ease;max-height:70vh;overflow-y:auto}
.pop h3{margin:0;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}
.nit{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--border);text-decoration:none;color:var(--text)}
.nit:first-of-type{border-top:0}.nit:hover{background:var(--soft)}
.ni{width:28px;height:28px}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise .28s ease both}
.cmdov{align-items:flex-start;padding-top:12vh;z-index:70}
.cmd{background:var(--card);width:100%;max-width:600px;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4);animation:pin .16s ease}
.cmdi{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.cmdi svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.cmdi input{border:0;background:transparent;min-height:34px;padding:0;font-size:16px;outline:none}
#cmd-l{list-style:none;margin:0;padding:6px;max-height:52vh;overflow:auto}
#cmd-l li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer}
#cmd-l li[aria-selected="true"],#cmd-l li:hover{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
#cmd-l .ck{font-size:11px;font-weight:700;color:var(--acct);min-width:68px;text-transform:uppercase;letter-spacing:.04em}
#cmd-l .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cmd-l .cs{color:var(--muted);font-size:12px;white-space:nowrap}
.cmdf{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;background:var(--soft)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit;position:relative;transition:transform .15s,box-shadow .15s,border-color .15s;min-width:0}
a.kpi:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 26px rgba(16,27,46,.1)}
.kpi small{color:var(--muted);font-weight:500;font-size:12px}
.kpi b{font-size:20px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.kpi .dl{font-size:12px;font-weight:600}
.up{color:var(--tP)}.dn{color:var(--danger)}
.spark{width:100%;height:30px;margin-top:6px}
.kring{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.ring{flex:none}
.pbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pb1{min-width:150px}
.pbx{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nbox{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--bD);color:var(--tD);font-size:13px;margin-bottom:14px;line-height:1.45}
.nbox.w{background:var(--bR);color:var(--tR)}
.nbox a{color:inherit;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--bD);color:var(--tD)}

function periodRange(k){var t=new Date(),y=t.getFullYear(),m=t.getMonth();function I(d){return isoDay(d)}
 switch(k){case 'hoje':return [I(t),I(t)];case 'ontem':var o=new Date(y,m,t.getDate()-1);return [I(o),I(o)];case 'semana':var wd=(t.getDay()+6)%7;return [I(new Date(y,m,t.getDate()-wd)),I(t)];case 'mes':return [I(new Date(y,m,1)),I(new Date(y,m+1,0))];case 'mes_ant':return [I(new Date(y,m-1,1)),I(new Date(y,m,0))];case 'trim':var q=Math.floor(m/3)*3;return [I(new Date(y,q,1)),I(new Date(y,q+3,0))];case 'ano':return [y+'-01-01',y+'-12-31'];case 'ano_ant':return [(y-1)+'-01-01',(y-1)+'-12-31'];default:return ['',''];}}

 {k:'cc',t:'Conta Corrente de Cliente',d:'Visualize as suas receitas por cliente.',sub:'Movimentos de débito e crédito por cliente.',c:'#1d9e75',cli:1,fn:function(r){var ev=[];S.docs.forEach(function(d){if(!isRev(d))return;if(r.cliente&&String(d.customerId)!==String(r.cliente))return;var c=calc(d);ev.push({date:d.date,cid:d.customerId,doc:d.number,txt:TYPES[d.type].n,deb:c.sg>0?c.total:0,cre:c.sg<0?c.total:0});(d.payments||[]).forEach(function(p){ev.push({date:p.date,cid:d.customerId,doc:d.number,txt:'Pagamento ('+p.method+')',deb:0,cre:p.amount})})});
  ev=ev.filter(function(e){return inR(e.date,r)}).sort(function(a,b){return a.cid-b.cid||(a.date<b.date?-1:1)});var bal={},td=0,tc=0;
  var rows=ev.map(function(e){bal[e.cid]=(bal[e.cid]||0)+e.deb-e.cre;td+=e.deb;tc+=e.cre;return [brDate(e.date),S.contacts.find(function(c){return c.id===e.cid}).name,e.doc,e.txt,money(e.deb),money(e.cre),money(bal[e.cid])]});

 {k:'pf',nop:1,t:'Pagamentos em Falta',d:'Visualize um sumário de todos os valores e clientes em dívida.',sub:'Valores e clientes em dívida.',c:'#d85a30',cli:1,fn:function(r){var t=TODAY(),tot=0;var rows=S.docs.filter(function(d){return outstanding(d)>0&&(!r.cliente||String(d.customerId)===String(r.cliente))}).sort(function(a,b){return cust(a).name<cust(b).name?-1:a.due<b.due?-1:1}).map(function(d){var o=outstanding(d);tot+=o;return [cust(d).name,d.number,brDate(d.date),brDate(d.due),d.due<t?String(diffDays(t,d.due)):'—',money(o)]});return {cols:['Cliente','Documento','Data','Vence','Dias em atraso','Em dívida'],num:[4,5],rows:rows,foot:['','','','','Total',money(tot)]}}},
 {k:'li',t:'Liquidação de Impostos',d:'Extrai uma listagem dos impostos a pagar num determinado período de tempo.',sub:'Imposto liquidado por mês.',c:'#2f6f8f',fn:function(r){var by={};revInRange(r).forEach(function(d){var c=calc(d),k=d.date.slice(0,7);by[k]=by[k]||{b:0,t:0};by[k].b+=c.sg*c.net;by[k].t+=c.sg*c.tax});var tb=0,tt=0;var rows=Object.keys(by).sort().map(function(k){tb+=by[k].b;tt+=by[k].t;return [MONTHS[+k.slice(5)-1]+' '+k.slice(0,4),money(by[k].b),money(by[k].t)]});return {cols:['Mês','Base tributável','Imposto liquidado'],num:[1,2],rows:rows,foot:['Total',money(tb),money(tt)]}}},
 {k:'fi',t:'Facturação por Item',d:'Saiba quanto facturou num determinado período de tempo. Valores com e sem impostos.',sub:'Valores com e sem impostos por item.',c:'#ef9f27',fn:function(r){var by={};revInRange(r).forEach(function(d){var cc=calc(d),sg=cc.sg;cc.rows.forEach(function(l){by[l.desc]=by[l.desc]||{q:0,n:0,t:0};by[l.desc].q+=sg*(+l.qty||0);by[l.desc].n+=sg*l.net;by[l.desc].t+=sg*l.tax})});var a=0,b=0,c2=0;var rows=Object.keys(by).sort().map(function(k){a+=by[k].n;b+=by[k].t;c2+=by[k].n+by[k].t;return [k,String(by[k].q),money(by[k].n),money(by[k].t),money(by[k].n+by[k].t)]});return {cols:['Item','Qtd.','S/IVA','IVA','Total'],num:[1,2,3,4],rows:rows,foot:['Total','',money(a),money(b),money(c2)]}}},
 {k:'rf',t:'Relatório de Facturação',d:'Saiba quanto facturou num determinado período de tempo. Valores com e sem impostos.',sub:'Listagem de todos os documentos emitidos.',c:'#1a4fd0',cli:1,doc:1,fn:function(r){var a=0,b=0,rt=0,tt=0;var rows=revInRange(r).sort(function(x,y){return x.date<y.date?-1:1}).map(function(d){var c=calc(d);a+=c.sg*c.net;b+=c.sg*c.tax;rt+=c.sg*c.ret;tt+=c.sg*c.total;return [TYPES[d.type].n,d.number,cust(d).name,brDate(d.date),money(c.sg*c.net),money(c.sg*c.ret)]});return {cols:['Documento','Número','Cliente','Data','S/Taxa/IVA','Retenção'],num:[4,5],rows:rows,sum:[['Total Incidência',money(a)],['Imposto/Taxa/IVA',money(b)],['Retenção',money(rt)],['Total',money(tt)]]}}},
 {k:'mi',t:'Mapa de Impostos',d:'Extraia uma listagem dos impostos facturados num dado período de tempo.',sub:'',c:'#7f77dd',fn:function(r){var by={};revInRange(r).forEach(function(d){var c=calc(d);Object.keys(c.by).forEach(function(k){by[k]=by[k]||{b:0,t:0};by[k].b+=c.sg*c.by[k].base;by[k].t+=c.sg*c.by[k].tax})});var a=0,b=0;var rows=Object.keys(by).sort(function(x,y){return y-x}).map(function(k){a+=by[k].b;b+=by[k].t;return [+k?k+'%':'Isento',money(by[k].b),money(by[k].t)]});return {cols:['Taxa','Incidência','Total do IVA'],num:[1,2],rows:rows,foot:['Total',money(a),money(b)]}}},
 {k:'co',t:'Relatório por Colaborador',d:'Saiba quanto um colaborador facturou num determinado período de tempo.',sub:'Facturação por colaborador.',c:'#8e1fa8',fn:function(r){var by={};revInRange(r).forEach(function(d){var c=calc(d);by[d.createdBy]=by[d.createdBy]||{n:0,a:0,b:0,t:0};by[d.createdBy].n++;by[d.createdBy].a+=c.sg*c.net;by[d.createdBy].b+=c.sg*c.tax;by[d.createdBy].t+=c.sg*c.total});var rows=Object.keys(by).sort().map(function(k){return [k,String(by[k].n),money(by[k].a),money(by[k].b),money(by[k].t)]});return {cols:['Colaborador','Documentos','S/IVA','IVA','Total'],num:[1,2,3,4],rows:rows}}},
 {k:'pe',t:'Pagamentos Efectuados',d:'Saiba quais as facturas pagas.',sub:'Facturas pagas no período.',c:'#0b9a68',cli:1,fn:function(r){var rows=[],tot=0;S.docs.forEach(function(d){if(d.status==='rascunho')return;if(r.cliente&&String(d.customerId)!==String(r.cliente))return;(d.payments||[]).forEach(function(p){if(!inR(p.date,r))return;tot+=p.amount;rows.push([p.date,brDate(p.date),d.number,cust(d).name,p.method,money(p.amount)])})});rows.sort(function(a,b){return a[0]<b[0]?-1:1});rows=rows.map(function(x){return x.slice(1)});return {cols:['Data','Documento','Cliente','Método','Valor'],num:[4],rows:rows,foot:['','','','Total',money(tot)]}}}

function route(){var n=location.hash.slice(1);UI.page=ROUTES[n]||'dash';UI.sub=null;UI.ed=null;UI.sel=new Set();UI.rep=null;closePop();var sh=$('#shell');if(sh)sh.classList.remove('nav-open');render();var mn=$('#app');if(mn&&S.loggedIn){try{mn.focus({preventScroll:true})}catch(e){}}if(UI.pend){var pf=UI.pend;UI.pend=null;pf()}}

/* edição */
function validateEd(forEmit){var d=UI.ed;if(forEmit&&!d.customerId&&!d.newClient.name.trim())return 'Escolha ou crie um cliente.';var ls=d.lines.filter(function(l){return String(l.desc).trim()});if(forEmit&&!ls.length)return 'Adicione pelo menos uma linha com descrição.';if(forEmit&&ls.some(function(l){return !(+l.qty>0)||!(l.price>0)}))return 'Quantidade e preço têm de ser superiores a zero.';
 if(forEmit&&d.type==='GT'){if(!d.transport.loadDate)return 'Indique a data de carga.';if(!d.transport.from.addr.trim()||!d.transport.to.addr.trim())return 'Indique o endereço do local de carga e do local de entrega.'}
 if(forEmit&&d.type==='EN'&&!d.delivery.date)return 'Indique a data de entrega.';
 if(!d.date)return 'Indique a data.';return ''}
function edErr(m){var e=$('#ed-err');if(!e)return;if(!m){e.classList.add('hide');return}e.textContent=m;e.classList.remove('hide')}
function persistEd(emit){var d=UI.ed;
 if(!d.customerId&&d.newClient.name.trim()){var nc=d.newClient,ct={id:nid(),name:nc.name.trim(),nif:nc.nif.trim(),email:nc.email.trim(),phone:nc.phone.trim(),addr:nc.addr.trim(),kind:'Cliente'};S.contacts.push(ct);d.customerId=ct.id}
 d.lines=d.lines.filter(function(l){return String(l.desc).trim()||l.price||String(l.code).trim()});if(!d.lines.length)d.lines=[blankLine()];
 d.lines=d.lines.map(function(l){var o={code:String(l.code||'').trim(),desc:String(l.desc).trim(),itemId:l.itemId,qty:+l.qty||0,price:l.price||0,disc:+l.disc||0,rate:+l.rate||0,newItem:false};
  if(l.newItem&&o.desc&&!S.items.some(function(i){return i.ref.toLowerCase()===o.code.toLowerCase()&&o.code})){var it={id:nid(),ref:o.code||('IT'+pad(S.items.length+1,3)),desc:o.desc,kind:'Produto',price:o.price,rate:o.rate,unit:'un'};S.items.push(it);o.itemId=it.id;if(!o.code)o.code=it.ref}return o});
 d.due=calcDue(d);d.ret=String(d.ret);d.gdisc=String(d.gdisc);
 var doc;if(d.id){doc=S.docs.find(function(x){return x.id===d.id});Object.assign(doc,d)}else{d.id=nid();S.docs.push(d);doc=d}
 if(emit){finalize(doc);if(doc.origin){var o2=S.docs.find(function(x){return x.id===doc.origin});if(o2)o2.convertedTo=doc.number}}
 save();return doc}

 balCsv:function(){var b=balRows();csvOut('Balancete (CSV)',[['Conta','Designação','Saldo inicial D','Saldo inicial C','Mov. D','Mov. C','Saldo final D','Saldo final C']].concat(b.rows.map(function(x){return [x.code,x.name,x.od/100,x.oc/100,x.md/100,x.mc/100,x.fd/100,x.fc/100]})))},
 balPrint:function(){var t=$('#bal-table');if(!t)return;var r=apRange();$('#print-area').innerHTML='<h2>Balancete — '+esc(S.company.name)+'</h2><p>'+esc(periodText({de:r[0],ate:r[1]}))+'</p>'+t.outerHTML;setTimeout(function(){try{window.print()}catch(e){toast('Impressão indisponível neste ambiente')}},150)},
 razCsv:function(){var r=apRange(),rows=[['Data','Ref.','Descrição','Débito','Crédito']];allEntries().forEach(function(e){if(!inRange(e.date,r[0],r[1]))return;e.lines.forEach(function(l){if(l.acc===UI.lg)rows.push([e.date,e.ref,e.desc,l.d/100,l.c/100])})});csvOut('Razão da conta '+UI.lg+' (CSV)',rows)},
 ivaCsv:function(){var v=ivaCalc(UI.ivam),rows=[['Taxa','Base','IVA']];Object.keys(v.by).sort(function(a,b){return b-a}).forEach(function(k){rows.push([k+'%',v.by[k].base/100,v.by[k].tax/100])});rows.push(['IVA liquidado','',v.liq/100]);rows.push(['IVA dedutível','',v.ded/100]);rows.push(['A pagar','',v.pay/100]);csvOut('Apuramento do IVA '+UI.ivam+' (CSV)',rows)},
 saftAcc:function(){var r=apRange(),ents=allEntries().filter(function(e){return inRange(e.date,r[0],r[1])}),x='<?xml version="1.0" encoding="UTF-8"?>\n<AuditFile>\n  <Header>\n    <Nota>Estrutura simplificada de demonstração, inspirada no SAF-T (AO). Não é o ficheiro oficial.</Nota>\n    <TaxRegistrationNumber>'+esc(S.company.nif)+'</TaxRegistrationNumber>\n    <CompanyName>'+esc(S.company.name)+'</CompanyName>\n    <FiscalYear>'+esc((r[1]||TODAY()).slice(0,4))+'</FiscalYear>\n    <CurrencyCode>AOA</CurrencyCode>\n  </Header>\n  <GeneralLedgerAccounts>\n'+accList().map(function(a){return '    <Account><AccountID>'+esc(a.code)+'</AccountID><AccountDescription>'+esc(a.name)+'</AccountDescription></Account>'}).join('\n')+'\n  </GeneralLedgerAccounts>\n  <GeneralLedgerEntries>\n'+ents.map(function(e){return '    <Journal><TransactionID>'+esc(e.id)+'</TransactionID><TransactionDate>'+e.date+'</TransactionDate><Description>'+esc(e.desc)+'</Description>\n'+e.lines.map(function(l){return '      <'+(l.d?'DebitLine':'CreditLine')+'><AccountID>'+esc(l.acc)+'</AccountID><Amount>'+((l.d||l.c)/100).toFixed(2)+'</Amount></'+(l.d?'DebitLine':'CreditLine')+'>'}).join('\n')+'\n    </Journal>'}).join('\n')+'\n  </GeneralLedgerEntries>\n</AuditFile>';
  textModal('SAF-T de Contabilidade (demonstração)',x,'O ficheiro oficial deve ser gerado por software validado e submetido até 10 de Abril.')}
});

function regNote(d,c){var o=[],reg=regime();if(TYPES[d.type].fisc&&reg!=='geral')o.push('IVA — '+(reg==='exclusao'?'Regime de Exclusão':'Regime Simplificado'));if(c.by['0']){var tx=S.taxes.find(function(x){return x.rate===0});o.push('Isento: '+(tx&&tx.motivo?tx.motivo:'indicar o motivo legal'))}if(d.type==='AF')o.push('Auto-Facturação');return o.length?'<p style="margin:8px 0;font-size:12px"><b>'+esc(o.join(' · '))+'</b></p>':''}
function lateMsg(d){if(!TYPES[d.type].fisc)return '';var n=workDays(d.date,TODAY());return n>5?' Atenção: a data do documento ('+brDate(d.date)+') ultrapassa o 5.º dia útil. A emissão fora de prazo pode ser punida com coima de 0,2% do valor (Dec. Pres. 71/25, arts. 8.º e 35.º).':''}

/* eventos */
document.addEventListener('click',function(e){
 if(UI.pop&&!e.target.closest('.pop,#bell'))closePop();
 if(e.target.dataset&&e.target.dataset.cov){closeCmd();return}
 var ci=e.target.closest&&e.target.closest('[data-cmd]');if(ci){runCmd(+ci.dataset.cmd);return}
 if(e.target.closest&&e.target.closest('.nav a')){var shl=$('#shell');if(shl)shl.classList.remove('nav-open')}
 if(e.target.dataset&&e.target.dataset.ov&&e.target.classList.contains('ov')){closeModal();return}
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.dataset.act;if(el.tagName==='SELECT')return;if(el.tagName==='INPUT'&&(a==='toggleYear'||a==='repDm'))return;if(ACT[a])ACT[a](el,e)});
document.addEventListener('change',function(e){var el=e.target;
 if(el.dataset&&el.dataset.chg&&ACT[el.dataset.chg]){ACT[el.dataset.chg](el);return}
 if(el.dataset&&el.dataset.act==='toggleYear'){ACT.toggleYear(el);return}
 if(el.dataset&&el.dataset.act==='qyear'){ACT.qyear(el);return}
 if(el.dataset&&el.dataset.act==='repPer'){ACT.repPer(el);return}
 if(el.dataset&&el.dataset.act==='repDm'){ACT.repDm(el);return}
 if(el.id==='role'){S.role=el.value;save();render();return}
 onEdit(e)});
document.addEventListener('input',onEdit);
function onEdit(e){var t=e.target;if(t.id==='cmd-q'){cmdFilter();return}if(t.closest&&t.closest('#j-lines')){updJ();return}if(!UI.ed||UI.sub!=='edit'||!t.dataset)return;var d=UI.ed;
 if(t.dataset.ed){var k=t.dataset.ed;
  if(k==='customerName'){var v=t.value.trim(),m=S.contacts.find(function(c){return c.name.toLowerCase()===v.toLowerCase()});var was=d.customerId;if(m){d.customerId=m.id}else{d.customerId='';d.newClient.name=t.value}
   if(m?was!==m.id:(was!==''||true)){var box=$('#ed-clientbox');var key=m?'m'+m.id:(v?'n':'');if(d._cb!==key){d._cb=key;box.innerHTML=clientBox()}}edErr('');return}
  setPath(d,k,t.value);if(k==='date'||k==='terms'){d.due=calcDue(d)}updEd();edErr('');return}
 if(t.dataset.f){var row=t.closest('[data-i]'),i=+row.dataset.i,l=d.lines[i];if(!l)return;var f=t.dataset.f;if(f==='price')l.price=toCents(t.value);else if(f==='rate')l.rate=+t.value;else l[f]=t.value;if(f==='code'&&!l.itemId&&String(t.value).trim()&&!String(l.desc).trim())l.newItem=true;updEd();edErr('')}}
document.addEventListener('keydown',function(e){
 if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){e.preventDefault();if(UI.cmd)closeCmd();else openCmd();return}
 if(UI.cmd){if(e.key==='Escape'){e.preventDefault();closeCmd();return}if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();var cn=UI.cmd.items.length;if(cn){UI.cmd.i=(UI.cmd.i+(e.key==='ArrowDown'?1:cn-1))%cn;cmdPaint()}return}if(e.key==='Enter'){e.preventDefault();runCmd(UI.cmd.i);return}}
 if(e.key==='Escape'&&UI.pop){closePop();return}
 if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName||'')&&S.loggedIn&&!$('#modal-root').innerHTML){e.preventDefault();openCmd();return}
 if(e.key==='Escape'&&$('#modal-root').innerHTML)closeModal();if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();var a=e.target.dataset.enter;ACT[a]&&ACT[a](e.target)}});
window.addEventListener('hashchange',route);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){applyBrand()})}catch(e){}

load();
if(!location.hash&&S.loggedIn)location.hash='visao-global';
route();
window.__app={S:function(){return S},ACT:ACT,UI:UI,route:route,render:render,seed:seed,REPORTS:REPORTS,calc:calc,allEntries:allEntries,checks:complianceChecks,bsNums:bsNums,drNums:drNums,ivaCalc:ivaCalc,balRows:balRows,hashAudit:hashAudit,cmdItems:cmdItems};
})();
